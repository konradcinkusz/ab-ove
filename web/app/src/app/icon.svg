<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 2 60 60" width="60" height="60">
  <!--
    THE TAB'S ICON (issue #150): the mark from docs/assets/brand/ab-ovo-logo.svg, without the
    wordmark. The egg that is also a zero, barred by the line a reader writes an answer on;
    the two paths are the lockup's own, in the lockup's own 64-unit space, and
    lib/theme/tokens.test.ts fails if they stop being the same paths.

    Served by Next's file convention from this origin (app/icon.svg, linked from every page's
    head), never from anywhere else (FRONTEND-BFF.md §1, AGENTS.md item 8), and outside the
    page gate in middleware.ts, so a reader with no account gets the icon rather than a
    redirect to sign-in.

    Two things differ from the lockup, and both are about 16 pixels:
      - the stroke is 5 rather than 4, because a quarter-scale 4 is one pixel of hairline in
        a tab, and the viewBox is cropped to the mark so the egg takes more of the square;
      - ONE file switches itself between schemes with a style element. The lockup is two
        files because GitHub's Markdown sanitiser strips a style element out of an SVG; this
        one is served by the app, and the browser honours prefers-color-scheme inside it.

    Colours are the app's own tokens from globals.css, the ink for the egg and the accent for
    the rule, light and dark; tokens.test.ts holds them to it. (No double hyphen anywhere in
    this comment, which is why the tokens are not named by their custom-property names: an
    XML comment may not contain one, and a browser refuses the whole file over it.)
  -->
  <style>
    .egg { stroke: #12151b; }
    .rule { stroke: #1f4f8b; }
    @media (prefers-color-scheme: dark) {
      .egg { stroke: #e8e6e1; }
      .rule { stroke: #8fb6e8; }
    }
  </style>
  <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path class="egg" d="M32 9C40.5 9 49 22.5 49 34.5C49 46 41.5 55 32 55C22.5 55 15 46 15 34.5C15 22.5 23.5 9 32 9Z"/>
    <path class="rule" d="M5 41H59"/>
  </g>
</svg>
