# ci.yml — the gate every change passes before it can be a tag.
#
# TESTING-STRATEGY.md §3 commits a when-to-run matrix and then requires that "the CI
# workflow files must implement that matrix exactly". This file is that implementation
# for the three contexts a branch can be in:
#
#   |                          | PR draft | PR ready | merge to main |
#   |--------------------------|----------|----------|---------------|
#   | Unit + lint (+ guards)   | always   | always   | always        |
#   | Integration              | skip     | always   | always        |
#   | Smoke E2E                | skip     | always   | always        |
#   | Core regression          | skip     | if touched | always      |
#
# The .NET suite covers the first two rows at once and runs unconditionally, which is a
# deliberate reading rather than a shortcut: TESTING-STRATEGY.md §4 tier 1 puts unit AND
# "most integration tests" in-memory with no container, and tests/AbOvo.Api.Tests is
# exactly that — WebApplicationFactory over the InMemory provider (P4). Nothing in it
# costs the minutes the matrix's "skip on draft" column exists to save. The tier that
# does cost minutes is E2E, and that is the tier gated on draft below.
#
# "Core regression: if touched area" is implemented as its stronger neighbour — the full
# suite runs on every push to main rather than being selected per touched area. Selecting
# by touched area on a PR needs a path→flow map that does not exist yet; claiming one
# here would be the kind of configuration nothing executes that TESTING-STRATEGY.md §9
# forbids.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A superseded PR run is minutes spent on a commit nobody will merge. main is never
# cancelled: every commit on it is a candidate for a tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # One place for the Node major. The Dockerfile, web/.npmrc's engine-strict and this
  # value are the three claims about the toolchain, and they have to agree.
  NODE_VERSION: '22'

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────
  # The .NET build gate. Warnings are errors here AND in Directory.Build.props, on
  # purpose: the props file is the developer-facing rule and this flag is the one a
  # pull request cannot edit out of the build without editing the workflow, which is a
  # reviewable diff.
  # ───────────────────────────────────────────────────────────────────────────────────
  dotnet:
    name: dotnet build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK version is global.json's to state, never this file's. Two places
          # naming a version is one place that goes stale.
          global-json-file: global.json

      # NuGetAudit is on at level `low` with NuGetAuditMode=all in Directory.Build.props,
      # and TreatWarningsAsErrors promotes NU1901-NU1904 to errors — so a vulnerable
      # package, transitive ones included, fails HERE, at restore, before anything is
      # compiled. That is the dependency half of the supply-chain gate; the SAST half is
      # codeql.yml.
      # ─────────────────────────────────────────────────────────────────────────────────
      # THE BOOK'S OWN VALUES, because one test in this suite is a gate ACROSS repositories.
      #
      # `RatesCarryTheirIntervalTests` requires this service's interval arithmetic to
      # reproduce four figures Program P27 commits — read out of
      # web/content/book/figures/values/p27.tex rather than typed here, because a test that
      # hard-coded them would be this repository remembering a number the book computes and
      # would keep passing on the day the book's own figures moved (ADR-0024 §1).
      #
      # web/content/book/ is gitignored: it is derived, fetched at the pinned revision and
      # verified against a digest per file. So without this step the test fails with
      # "p27.tex is missing" — which was measured by deleting the file and running the suite,
      # rather than assumed from the .gitignore.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Fetch the book content at its pinned revision
        run: bash scripts/fetch-book-content.sh

      - name: Restore
        run: dotnet restore AbOvo.sln

      - name: Build (warnings are errors)
        run: dotnet build AbOvo.sln --configuration Release --no-restore -warnaserror

      # The ARCHITECTURE TEST lives in tests/AbOvo.Api.Tests/ArchitectureTests.cs and is
      # an ordinary xUnit fact, so it runs here and is deliberately NOT duplicated as a
      # shell script. A rule with two implementations has two behaviours, and the one
      # that drifts is always the copy nobody runs locally.
      - name: Test (unit, in-memory integration, and the architecture rules)
        run: dotnet test AbOvo.sln --configuration Release --no-build --verbosity normal

  # ───────────────────────────────────────────────────────────────────────────────────
  # The kernel size check (P2).
  #
  # WHY THIS GATE COUNTS CODE LINES AND NOT RAW LINES.
  #
  # The constitution's ceiling of ~800 is a count of the REFERENCE kernel's .cs lines,
  # written in a house style that comments sparingly. This kernel is written under P14,
  # which asks that a block cite the principle it exists to satisfy — and it does, on
  # nearly every block. Counting raw lines would therefore set P2 and P14 against each
  # other: every citation P14 asks for would spend a line of the budget P2 sets, and the
  # only way to satisfy both would be to delete the reasoning, which is the one part of
  # the kernel that cannot be recovered from the code.
  #
  # So the gate counts what the ceiling is a count OF — non-blank, non-comment lines of
  # C# — and prints the raw figure beside it so the divergence is visible rather than
  # hidden. The raw number is reported, never gated: the moment it is gated, P14 becomes
  # expensive again.
  #
  # The size check is a PROXY. What it actually protects against is a kernel that has
  # started to carry domain, and the thing that catches that directly is the
  # architecture test in the job above. Neither one alone is the gate.
  # ───────────────────────────────────────────────────────────────────────────────────
  kernel-size:
    name: kernel size (P2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KERNEL_DIR: src/AbOvo.ServiceDefaults
      # P2's mechanical ceiling, in code lines. Raising it is a decision, and it is a
      # decision that has to be made in a diff to this file.
      KERNEL_CEILING: '800'
    steps:
      - uses: actions/checkout@v4

      - name: Count the kernel
        shell: bash
        run: |
          set -euo pipefail

          # bin/ and obj/ are build output; a machine-generated AssemblyInfo.cs is not
          # kernel a human has to hold in their head.
          mapfile -d '' files < <(
            find "$KERNEL_DIR" -name '*.cs' \
              -not -path '*/obj/*' -not -path '*/bin/*' -print0 | sort -z
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No .cs files found under $KERNEL_DIR. The kernel size check is measuring nothing, which is worse than measuring the wrong thing."
            exit 1
          fi

          # NON-BLANK, NON-COMMENT is defined mechanically: after trimming leading
          # whitespace the line is empty, or begins with //, /*, * or */. That last one
          # matters — it is every continuation line of the doc comments P14 asks for.
          report="$(
            awk '
              FNR == 1 { n++; order[n] = FILENAME }
              { rawf[FILENAME]++; total_raw++ }
              { line = $0; sub(/^[ \t]+/, "", line) }
              line == ""        { next }
              line ~ /^\/\//    { next }
              line ~ /^\/\*/    { next }
              line ~ /^\*/      { next }
              { codef[FILENAME]++; total_code++ }
              END {
                # The markdown row is emitted here rather than reconstructed downstream.
                # A sed that rebuilt it would need `$` as an end-of-line anchor inside
                # single quotes, which is indistinguishable from a variable somebody
                # forgot to expand — to a reader and to shellcheck alike.
                for (i = 1; i <= n; i++) {
                  f = order[i]
                  printf "| `%s` | %d | %d |\n", f, codef[f] + 0, rawf[f] + 0
                }
                printf "TOTAL_CODE=%d\n", total_code + 0
                printf "TOTAL_RAW=%d\n",  total_raw  + 0
              }
            ' "${files[@]}"
          )"

          code="$(printf '%s\n' "$report" | sed -n 's/^TOTAL_CODE=//p')"
          raw="$(printf '%s\n' "$report" | sed -n 's/^TOTAL_RAW=//p')"

          {
            echo "### Kernel size (P2)"
            echo
            echo "| File | Code | Raw |"
            echo "| --- | ---: | ---: |"
            printf '%s\n' "$report" | grep -v '^TOTAL_'
            echo "| **Total** | **$code** | **$raw** |"
            echo
            echo "Ceiling is **$KERNEL_CEILING code lines**. Raw lines are reported, never gated —"
            echo "the gap between the two columns is the reasoning P14 asks each block to carry."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "kernel code lines : $code  (ceiling $KERNEL_CEILING)"
          echo "kernel raw lines  : $raw   (reported, not gated)"

          if [ "$code" -gt "$KERNEL_CEILING" ]; then
            echo "::error::The kernel is $code code lines, past P2's ceiling of $KERNEL_CEILING. Move something out of $KERNEL_DIR, or change the ceiling in this workflow and say why in the pull request."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────────────
  # The frontend gate. One setup block for the whole frontend tree, which is what
  # web/pnpm-workspace.yaml listing every app buys — CI never grows a per-app rung.
  # ───────────────────────────────────────────────────────────────────────────────────
  web:
    name: web lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # setup-node's cache resolves this path before any of our own steps run, so a
      # missing lockfile would surface as "Some specified paths were not resolved"
      # rather than as the thing it is. Fail first, with the sentence that fixes it.
      - name: Require the workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f pnpm-lock.yaml || {
            echo "::error file=web/pnpm-lock.yaml::web/pnpm-lock.yaml is missing. There is exactly one lockfile for the frontend tree and it lives beside web/pnpm-workspace.yaml. Run 'pnpm install' in web/ and commit it."
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The pnpm version is declared once, in web/package.json's packageManager
          # field. This reads it rather than restating it.
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm -r --no-bail typecheck` — tsc over every workspace member. `next build`
      # type-checks the app's own graph, but not files no route reaches, and the BFF's
      # server-only modules are exactly the shape that can end up unreferenced for a
      # commit or two.
      - name: Typecheck
        run: pnpm typecheck

      # ─────────────────────────────────────────────────────────────────────────────────
      # The unit tier, wired in the same commit as its first test.
      #
      # E2E-ACCEPTANCE-TESTING.md §6: "CI wiring is a requirement of test #1, not a
      # follow-up after test #447." TESTING-STRATEGY.md §9: an unreferenced test entry
      # point is not a latent capability, it is documentation that lies. So the entry point
      # and the job step arrive together or neither does.
      #
      # It is `node --test` over .ts through Node 22's type stripping — no runner, no
      # transform, no dependency, and therefore not a third toolchain. It runs BEFORE the
      # build because it needs nothing the build produces and it fails in under a second:
      # a validator that has stopped rejecting malformed bundles should not wait behind
      # thirteen megabytes of Pyodide being staged.
      #
      # P13, which is why this exists at all rather than the assertions living in the
      # Playwright suite: test at the layer with the logic. A pure function asserted
      # through a browser is an acceptance test doing a unit's job, and it is slower,
      # flakier and less precise at it.
      # ─────────────────────────────────────────────────────────────────────────────────
      # ─────────────────────────────────────────────────────────────────────────────────
      # THE BOOK, because `pnpm build` cannot run without it.
      #
      # web/app's `prebuild` script stages the lab pane's two inputs into public/: the
      # Pyodide runtime from node_modules, and the book's lab engine from web/content/book.
      # The second is NOT in git (see .gitignore) — ADR-0008 makes it a versioned artefact
      # fetched at a pinned revision, with a sha256 per file in web/content/book.lock.json.
      # Nothing on a fresh runner fetches it but this step, and prebuild fails loudly
      # rather than silently shipping a pane with no engine.
      #
      # A FETCH, not `--check`. There is nothing on a fresh runner to check, and a --check
      # placed after the fetch would verify the bytes the fetch had just written and
      # verified — an assertion that cannot fail. The fetch is the gate: it compares every
      # file against its digest as it writes and exits non-zero on any mismatch, so a moved
      # pin, a stale digest or a hand-edited fixture all stop here. `--check` is the local
      # instrument, for the developer asking whether they edited a fetched file by hand.
      #
      # working-directory is overridden because this job otherwise runs in web/ and the
      # script resolves its own repository root from its own path.
      #
      # AND IT IS ABOVE THE UNIT TIER, WHICH IS A SECOND REASON AND A LOAD-BEARING ORDER.
      #
      # The unit tier now renders every maths span of the pinned bundle through KaTeX and
      # checks the verdict-able fixture against the book. Those tests ARE the render
      # guarantee. Run before this step they do not fail — they SKIP, with a green tick and
      # the words "no compiled bundle on disk" — and a guarantee that skips in CI is not a
      # guarantee. Measured on the run that found it: eight skips and one outright failure,
      # the failure being `runtime-assets.test.ts`, which calls `allBundles()`, which throws
      # when the pin does not resolve.
      #
      # Move this step back below the tests and eight of them go quiet while nothing goes
      # red. That is the failure this comment exists to prevent.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Fetch the book content at its pinned revision
        working-directory: .
        run: bash scripts/fetch-book-content.sh

      - name: Unit tests
        run: pnpm test


      - name: Build
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────────────
  # The E2E suite, WIRED IN THE SAME COMMIT AS THE SUITE ITSELF.
  #
  # E2E-ACCEPTANCE-TESTING.md §6: "CI wiring is a requirement of test #1, not a follow-up
  # after test #447." The audited estate had 447 Playwright tests and zero workflows
  # matching `e2e`, `playwright` or `acceptance`; the suite's existence was then cited as
  # coverage nobody was checking. Grep this file for those three words — they are here.
  #
  # Which layer runs where (TESTING-STRATEGY.md §2):
  #   pull_request  → test:smoke  — 5-10 min budget, single browser, critical path only
  #   push to main  → test:full   — 20-30 min budget, the charter's protected-flow set
  #
  # There is deliberately NO extended/cross-browser entry point referenced here, because
  # no CI context in this repository runs one. TESTING-STRATEGY.md §9: an unreferenced
  # test config is not a latent capability, it is documentation that lies. When a nightly
  # workflow exists, the extended layer arrives with it and not before.
  #
  # WHY THE SUITE IS NOT POINTED AT A DEPLOYED ENVIRONMENT. E2E-ACCEPTANCE-TESTING.md §6
  # says to aim the job at the estate's ephemeral PR environment rather than booting a
  # stack in the runner. This estate has no PR-environment workflow — FLY-IO-DEPLOYMENT
  # §3 fixes the Fly workflow set at three, and the tag pipeline deploys one shared dev
  # estate. A runner-local server is the right answer regardless: ADR-0060 means the
  # smoke layer's subject is the web app AND a real AbOvo.Api behind it, never the web app
  # alone. Nothing is being faked. If the suite is ever aimed at a deployed target instead,
  # E2E_BASE_URL is where that address goes and the servers below stop being started
  # (playwright.config.ts).
  #
  # THE BACKEND, AND WHICH DEPLOYMENT CAN SEE IT (issue #170, ADR-0035, ADR-0060).
  #
  # This job runs a Postgres service container and a real AbOvo.Api against it, and
  # ingests the compiled book bundle into it (the "Ingest the book content" step below) —
  # ADR-0060 means every reading page is a live call to it, not an optional one behind a
  # seam that might carry no bearer.
  #
  # It does NOT make the whole job signed-in. The suite drives two web deployments (see
  # tests/e2e/playwright.config.ts) and BOTH are given AB_OVO_API_URL — reading needs no
  # account, so it cannot be the axis these two differ on any more:
  #
  #   :3000  no identity service — a reader here can never be signed in, which is the one
  #          un-intercepted run this repository has against that state, and the product's
  #          remaining "no account" requirement (ADR-0060 superseding ADR-0004's other half).
  #          It reaches the API through tests/e2e/fixtures/api-fault.mts, a pass-through
  #          that can cut ONE reader off it, so the error page can be driven (issue #139)
  #   :3100  the signed-in deployment, pointed at the identity fixture as well as the API
  #
  # The API still listens on 8180 and not on its own 8080: 8080 is rung four of
  # FRONTEND-BFF.md §5's candidate ladder ("localhost"), which no real deployment can ever
  # reach — a CI job that let AB_OVO_API_URL go unset and still passed by falling onto that
  # rung would be testing a wiring path no deployment has. On 8180 the only way either
  # deployment reaches it is to be TOLD where it is, which is rung one and the way every
  # real deployment works.
  #
  # E2E_EXPECT_API IS STILL NOT SET HERE, and that is a different question from the one
  # above: the test it gates (`integration-report.spec.ts`'s `@core` live case) is about the
  # CLIENT reaching AbOvo.Api through the `/api/proxy/` route against a DEPLOYED target
  # (issue #270), not about a Server Component's own direct, server-side call — which is
  # what every reading page and this job's two local deployments use.
  # ───────────────────────────────────────────────────────────────────────────────────
  e2e:
    name: e2e (playwright acceptance)
    runs-on: ubuntu-latest
    # The one tier the matrix's "skip on PR draft" column is actually about: a draft PR
    # gets unit, lint and the guards, and does not spend ten minutes on a browser.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: [web]
    timeout-minutes: 40

    # ─────────────────────────────────────────────────────────────────────────────────
    # P3 — one Postgres, a logical database per service; here there is one service, so
    # one database. The image tag is pinned for the reason every image in this estate is
    # (SHARED-SERVICE-REUSE.md §2): `:latest` makes the runner's day the variable.
    #
    # NO PASSWORD, AND THEREFORE NO SECRET TO LEAK. `POSTGRES_HOST_AUTH_METHOD: trust`
    # is the whole of the authentication configuration, so the connection string below
    # carries no credential at all and AGENTS.md's "no secret is ever a literal" has
    # nothing to be true of. This is a container bound to one ephemeral runner's
    # loopback, holding a schema and no rows, destroyed with the machine — the same
    # reasoning that lets `fixtures/accounts.mts` hold passwords no deployment accepts.
    # Do not "improve" this by inventing a password: a literal one would be a secret in
    # a public file, and a generated one cannot be written here because service-container
    # `env` is evaluated before any step can run.
    # ─────────────────────────────────────────────────────────────────────────────────
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apidb
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname apidb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # There is exactly one source of truth for the port, and it is the Aspire
      # orchestration in src/AbOvo.AppHost/AppHost.cs, which maps web to 3000 — the same
      # number flyio/web.fly.toml's internal_port and the Dockerfile's EXPOSE carry.
      # A compiled-in fallback that has drifted from it is the tell that nobody has run
      # the suite in a while (E2E-ACCEPTANCE-TESTING.md §6).
      E2E_BASE_URL: http://127.0.0.1:3000

      # Deliberately NOT 8080 — see the note above the job. 8080 is the candidate
      # ladder's localhost rung, and an API there would be reachable from the deployment
      # whose whole purpose is to have none.
      E2E_API_BASE_URL: http://127.0.0.1:8180

      # The identity fixture's address, which AbOvo.Api validates tokens against.
      # tests/e2e/playwright.config.ts derives it as E2E_BASE_URL's port + 200 and
      # tests/e2e/fixtures/authservice-stub.mts defaults to the same number; the API is
      # started before Playwright runs, so the job has to name it up front. That is a
      # second place for one rule, and .github/scripts/wait-for-backend.sh's last check
      # is what stops the two drifting.
      E2E_AUTH_BASE_URL: http://127.0.0.1:3200

      # No credential in it, for the reason given above the service container.
      ABOVO_API_CONNECTION: Host=127.0.0.1;Port=5432;Database=apidb;Username=postgres

      # Under artifacts/, which .gitignore already reserves for build output, so the API's
      # log and pid cannot show up as untracked files. `runner.temp` would read better and
      # is not available in a job-level `env:` block — only `github` is.
      API_LOG: ${{ github.workspace }}/artifacts/abovo-api.log
      API_PID_FILE: ${{ github.workspace }}/artifacts/abovo-api.pid
    steps:
      - uses: actions/checkout@v4

      # A guard that FAILS, never one that passes. E2E-ACCEPTANCE-TESTING.md §2 bans
      # guard-then-bail inside a test because "skip if the feature isn't there" is
      # indistinguishable from "skip if the feature broke"; the same sentence is true one
      # level up, of a CI job that goes green when it cannot find the suite. The error
      # states the whole contract this job places on tests/e2e/, which it does not own.
      - name: Require the E2E suite
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in tests/e2e/package.json tests/e2e/pnpm-lock.yaml tests/e2e/playwright.config.ts; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::$f is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            cat <<'CONTRACT'
          The E2E job expects a self-contained pnpm package at tests/e2e:

            tests/e2e/package.json         with scripts "test:smoke" and "test:full"
            tests/e2e/pnpm-lock.yaml       its own lockfile (it is not a member of the
                                           web/ workspace, which owns exactly one lockfile
                                           and lists exactly one package)
            tests/e2e/playwright.config.ts with a webServer entry that starts the web app
                                           on the E2E_BASE_URL this job exports, and
                                           reuseExistingServer: !CI

          This job does not skip when the suite is absent. A green run that tested nothing
          is the failure mode the suite exists to prevent.
          CONTRACT
            exit 1
          fi

      # ─────────────────────────────────────────────────────────────────────────────────
      # THE BACKEND (issue #170, ADR-0035). Started here, before the frontend work, and
      # GATED IMMEDIATELY — a dead container is cheapest to read next to the step that
      # was supposed to fill it, and there is no point building thirteen megabytes of
      # Pyodide for a suite whose backend never came up.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The SDK version is global.json's to state, never this file's — the same
          # reasoning as the dotnet job above.
          global-json-file: global.json

      - name: Publish AbOvo.Api
        run: dotnet publish src/AbOvo.Api/AbOvo.Api.csproj --configuration Release --output artifacts/api

      - name: Start AbOvo.Api against the job's Postgres
        shell: bash
        run: |
          set -euo pipefail

          # THE ISSUER AND THE AUDIENCE ARE READ, NOT RETYPED. ADR-0031 records that this
          # estate declares them in four places and carries a test asserting the four
          # agree; that test parses named files, so a fifth copy written here would drift
          # silently. flyio/api.fly.toml is one of the four, and it is the one that speaks
          # for AbOvo.Api, so this job takes them from there.
          read_fly() {
            sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*\"\([^\"]*\)\".*/\1/p" flyio/api.fly.toml | head -n 1
          }
          issuer="$(read_fly Jwt__Issuer)"
          audience="$(read_fly Jwt__Audience)"
          if [ -z "$issuer" ] || [ -z "$audience" ]; then
            echo "::error file=flyio/api.fly.toml::Could not read Jwt__Issuer and Jwt__Audience out of flyio/api.fly.toml. The e2e job takes them from there rather than restating them (ADR-0031), so a renamed key has to fail here instead of quietly leaving AbOvo.Api with no identity configured."
            exit 1
          fi

          mkdir -p artifacts

          # `Jwt__Authority` is the SUITE'S FIXTURE, not the Fly address beside those two
          # in that file: the tokens this job validates are minted by
          # tests/e2e/fixtures/authservice-stub.mts, which publishes a JWKS and enough
          # OIDC metadata for a consumer configured with an authority to find it.
          #
          # THE TWO RATE LIMITS ARE RAISED, NOT REMOVED (RateLimitingExtensions.cs). The
          # policy partitions an anonymous caller by client IP, and every anonymous reader
          # this job's specs drive shares one — 127.0.0.1 — so the combined traffic of
          # dozens of specs each reading for real (ADR-0060) lands in the bucket a single
          # production visitor was sized for. One real reader still gets the production
          # figure everywhere else; this tells the limiter that this one IP here is standing
          # in for many.
          #
          # BOTH FIGURES, BECAUSE THE GLOBAL LIMITER IS NOT A FALLBACK FOR THE POLICY — IT
          # IS A SECOND TOLL EVERY REQUEST PAYS. ASP.NET's rate limiting middleware combines
          # `GlobalLimiter` with the endpoint's own policy and takes a lease from BOTH, so
          # the effective ceiling is the LOWER of the two. Raising only
          # `RateLimit__ApiPermitLimit` left this job capped at the global default of 500
          # requests a minute from one IP, which is under what a single-worker reading run
          # asks for: a frame is three calls (track, unit, step) and a reveal is a fourth,
          # and `specs/reading.spec.ts` alone walks a whole program of them. That is what
          # turned the smoke layer red with `advance(F02, answering 1) answered 429` on
          # specs that had nothing wrong with them — and, because the Server Component's
          # candidate ladder treated the 429 as "this rung is down", with a
          # `content API unavailable: http://localhost:8080` in the web server's log
          # pointing at an address this job never configured.
          ASPNETCORE_URLS="$E2E_API_BASE_URL" \
          ASPNETCORE_ENVIRONMENT=Production \
          DATABASE_PROVIDER=PostgreSQL \
          ConnectionStrings__apidb="$ABOVO_API_CONNECTION" \
          Jwt__Authority="$E2E_AUTH_BASE_URL" \
          Jwt__Issuer="$issuer" \
          Jwt__Audience="$audience" \
          Jwt__RequireHttpsMetadata=false \
          RateLimit__ApiPermitLimit=5000 \
          RateLimit__GlobalPermitLimit=5000 \
            nohup dotnet artifacts/api/AbOvo.Api.dll > "$API_LOG" 2>&1 &

          echo $! > "$API_PID_FILE"
          echo "AbOvo.Api started as pid $(cat "$API_PID_FILE"), logging to $API_LOG"

      # THE GATE. It fails; it never skips. Every branch names what did not start, and
      # each one has been watched firing — see the pull request that added it and the
      # header of the script itself.
      - name: Require Postgres and AbOvo.Api
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash .github/scripts/wait-for-backend.sh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      # ─────────────────────────────────────────────────────────────────────────────────
      # THE BOOK. Added with specs/lab-p01.spec.ts, which cannot run without it.
      #
      # web/content/book is NOT in git — `git ls-files web/content/` is empty. ADR-0008 makes the
      # book's lab engine a versioned ARTEFACT fetched at a pinned revision, with a sha256
      # per file in web/content/book.lock.json, so that "nothing under web/content/ is authored
      # here" is a checkable claim rather than a request. Nothing in CI fetched it until
      # now, because nothing in CI needed it.
      #
      # Two things need it, and the job fails at different points without it:
      #
      #   1. `pnpm --dir web build` runs a prebuild that copies web/content/book into
      #      public/book (minus lab/solutions/), so the lab pane has a virtual file system
      #      to mount. That script fails loudly when the book is absent — which is correct,
      #      and which is this step failing one line later with a worse message.
      #   2. specs/lab-p01.spec.ts reads web/content/book/lab/{exercises,solutions}/ IN NODE.
      #      The reference solutions are deliberately not served to the browser, so the
      #      test supplies them, and it reads the pinned file rather than carrying a copy
      #      of it that could drift.
      #
      # It is a FETCH and not a `--check`: there is nothing on a fresh runner to check. The
      # script verifies every digest as it writes and exits non-zero on any mismatch, so a
      # moved pin or a tampered file fails here rather than surfacing as a lab suite that
      # quietly tests different numbers from the ones the book prints.
      #
      # The `web` job runs `pnpm build` too and carries the same step, for the other of
      # the two reasons: its need comes from the prebuild script, this one's from the
      # spec. Two jobs, two independent needs, one script — which is why the step is
      # duplicated rather than factored into a composite action nobody would read.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Fetch the book content at its pinned revision
        run: bash scripts/fetch-book-content.sh

      # ─────────────────────────────────────────────────────────────────────────────────
      # INGEST THE COMPILED BUNDLE INTO AbOvo.Api — ADR-0060. Every reading page now makes
      # a live, gated call to AbOvo.Api's content endpoints (ContentEndpoints.cs); with no
      # bundle ingested, GET /content/{track} answers 404 for every one of them and the
      # failure shows up on whichever spec opens a frame first rather than here, where it
      # is legible. `fixtures/ingest-content.mts` carries the reasoning for how it gets an
      # Admin-role bearer with no real authservice in this job.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Ingest the book content into AbOvo.Api
        run: node --experimental-strip-types tests/e2e/fixtures/ingest-content.mts

      # The suite drives a production build, not `next dev`. A dev server has different
      # timing, different error overlays and different bundle behaviour from the artifact
      # that ships, and a suite that only ever sees the dev server is testing a program
      # nobody deploys.
      - name: Install and build the web app
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Install the E2E suite
        run: pnpm --dir tests/e2e install --frozen-lockfile

      # Chromium only. TESTING-STRATEGY.md §2 puts cross-browser in the extended layer,
      # which runs nightly — and this repository has no nightly context yet, so no
      # browser is installed for a layer nothing runs.
      - name: Install Playwright's browser
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium

      - name: Run the smoke layer
        if: github.event_name == 'pull_request'
        run: pnpm --dir tests/e2e run test:smoke

      - name: Run the core regression layer
        if: github.event_name == 'push'
        run: pnpm --dir tests/e2e run test:full

      # ─────────────────────────────────────────────────────────────────────────────────
      # THE SIGNED-IN PATH (issue #29), on BOTH events rather than one.
      #
      # Everything above runs against a web app with no identity service, because that is
      # what this job could start. The four things a signed-in reader depends on — a form
      # post answered with two cookies, their attributes, session rehydration, and the
      # middleware opening a gated page — were measured by hand once (docs/adr/0018) and
      # were evidence about one afternoon.
      #
      # This project starts a fixture (tests/e2e/fixtures/authservice-stub.mts) and a
      # SECOND web app pointed at it. It is seven tests and about eight seconds, so it runs
      # on a pull request as well as on a push: a gate that only runs after merge tells you
      # about a commit you can no longer decline.
      #
      # It is a separate step rather than `--project=identity` on the two above, because
      # the project exists only when this config is starting the servers — see
      # tests/e2e/playwright.config.ts and the note in tests/e2e/package.json.
      #
      # WHAT IT DOES NOT PROVE: the fixture and the code that reads it agree by
      # construction, so a green run here is not evidence that authservice still answers
      # this way. That half is web/app/src/lib/server/sign-in.test.ts, written from
      # authservice's own source. Issue #29 says so and does not close it.
      # ─────────────────────────────────────────────────────────────────────────────────
      - name: Run the identity layer
        run: pnpm --dir tests/e2e run test:identity

      # The gate above prints the API's log when the API is what failed. This covers the
      # other order: a suite that failed for a reason the API's log explains — a 401 nobody
      # expected, a migration that half-ran — where nothing would otherwise show it. It is
      # a log tail rather than an artifact because the interesting part is always the end
      # of it, and a file in the run's summary is one more click than anybody makes.
      - name: The AbOvo.Api log, when something failed
        if: failure()
        shell: bash
        run: |
          if [ -f "$API_LOG" ]; then
            echo "----- last 200 lines of $API_LOG -----"
            tail -n 200 "$API_LOG"
          else
            echo "There is no AbOvo.Api log at $API_LOG: the job failed before it was started."
          fi

      # trace: 'on-first-retry' and screenshot/video on failure are the harness defaults
      # TESTING-STRATEGY.md §5 prescribes, and they are worth nothing if the report never
      # leaves the runner. Uploaded only on failure: a green run's trace is bytes nobody
      # opens.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore
