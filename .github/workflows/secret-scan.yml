# secret-scan.yml — gitleaks: per event on every PR and push to main, and in full weekly.
#
# WHAT EACH RUN ACTUALLY COVERS, measured from the runs' own logs on 2026-09-15 rather
# than from this comment, which said something else and was wrong. The audit is
# docs/architecture/SECRET-HISTORY-AUDIT.md; the short version is that the per-event runs
# scan ONE COMMIT each and neither of them scans history:
#
#   push to main    --log-opts=-1                          ->  1 commits scanned
#   pull request    --log-opts=<head>^..<head>             ->  1 commits scanned
#   schedule/manual  no --log-opts, plus refs/pull/*/head   ->  every commit (56 today)
#
# This comment previously claimed the push run "scans the history reachable from main".
# It never has. That claim is why the `complete` job below exists: it is the only run in
# this repository that covers what a stranger can fetch, and before it existed 34 of the
# repository's 56 commits had never been scanned by anything.
#
# WHAT IT CANNOT DO, so nobody mistakes a green tick for the guarantee. Once a secret has
# been pushed to a remote it is compromised, and this job finds it rather than unfinding
# it — the response to a hit is to ROTATE the credential, and only then to rewrite the
# history. flyio/SECRETS.md names the five root secrets this estate has and where each is
# rotated.
#
# This is why every secret in this repository is named and never written down: the
# fly.toml files hold configuration only, the workflows reference ${{ secrets.NAME }} and
# never a value, and the connection strings are ASSEMBLED in the pipeline from a password
# plus a known host rather than stored whole. A scanner is the backstop for that
# discipline, not a substitute for it.

name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The complete scan is expensive relative to the per-event ones (it fetches every PR
  # ref) and its answer changes only when history changes, so it runs on a schedule
  # rather than on every push. Mondays, early, so a finding is waiting at the start of a
  # week rather than at the end of one.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    # Skipped on the two events the `complete` job owns, so a scheduled run does not also
    # perform the one-commit scan that prompted this whole audit.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0. NOT because this job scans history — measured, it scans one commit
      # whatever the checkout depth, because gitleaks-action passes its own --log-opts.
      # It is kept because the action computes a commit RANGE from the event payload, and
      # a shallow clone can lack the `<head>^` end of it, which fails the scan rather than
      # narrowing it. The depth that actually buys coverage is in the `complete` job.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts and public repositories, which is what
          # github.com/konradcinkusz/ab-ovo is. The action requires a license key only
          # when the repository belongs to a GitHub ORGANISATION; the day this repo moves
          # under one, that key goes in the repository secrets under this name and this
          # line starts resolving to it. Named here, unset today, so the failure on that
          # day reads as "buy a license" rather than as a scanner that stopped working.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── The only run that covers what a stranger can fetch ──────────────────────────────
  # `git clone` fetches refs/heads/* and refs/tags/*. It does NOT fetch refs/pull/*/head,
  # and GitHub keeps one of those per pull request permanently — including for commits
  # orphaned by a squash merge or a force-push, which is every pull request this
  # repository has merged. Measured 2026-09-15: a fresh clone sees 22 commits where the
  # remote holds 56, so 34 were fetchable by anybody and scanned by nothing.
  #
  # This job runs `scripts/scan-secrets.sh --complete`, which is the same command a
  # developer runs locally, rather than a second scanner configured in YAML. That is
  # REPO-BASELINE.md §4's local-mirror rule taken seriously: the previous arrangement had
  # CI and the script claiming to be 1:1 while scanning 1 commit and 22 respectively.
  complete:
    name: complete history (every ref, refs/pull/* included)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Depth matters here, unlike in the job above: this scan walks every commit it
          # can see, so a shallow clone would narrow the answer rather than fail it —
          # which is the failure mode that reports clean and means nothing.
          fetch-depth: 0

      # Pinned by version AND by checksum. An unpinned scanner is a gate whose rules can
      # change between two runs with no diff to review, and a pinned version fetched over
      # the network without a checksum is the supply-chain version of the same problem.
      # 8.24.3 is the version gitleaks-action installs for the job above, so both runs
      # apply one rule set — "a hook tuned differently from CI is two scanners, and the
      # looser of the two defines the repository's real posture" (SECURITY.md).
      - name: Install gitleaks 8.24.3
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --retry 3 --retry-all-errors -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # The script fetches refs/pull/*/head itself and REFUSES if it cannot, rather than
      # scanning the smaller set under the wider name. That refusal is the reason this
      # step needs no fetch of its own and no assertion about what checkout left behind.
      - name: Scan every commit
        run: bash scripts/scan-secrets.sh --complete
