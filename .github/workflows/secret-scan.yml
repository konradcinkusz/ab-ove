# secret-scan.yml — gitleaks, on every pull request and every push to main.
#
# WHY IT RUNS ON BOTH. A pull-request run scans the commits the PR adds, which catches a
# key before it is merged — the only moment at which removing it is cheap. The push run
# scans the history reachable from main, which catches the other case: a key that arrived
# by some path that was not a reviewed pull request (a direct push, a merge from a fork,
# an import). Either one alone leaves a door.
#
# WHAT IT CANNOT DO, so nobody mistakes a green tick for the guarantee. Once a secret has
# been pushed to a remote it is compromised, and this job finds it rather than unfinding
# it — the response to a hit is to ROTATE the credential, and only then to rewrite the
# history. flyio/SECRETS.md names the five root secrets this estate has and where each is
# rotated.
#
# This is why every secret in this repository is named and never written down: the
# fly.toml files hold configuration only, the workflows reference ${{ secrets.NAME }} and
# never a value, and the connection strings are ASSEMBLED in the pipeline from a password
# plus a known host rather than stored whole. A scanner is the backstop for that
# discipline, not a substitute for it.

name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0. gitleaks scans history, and a shallow clone is a scan of the tip
      # commit wearing the report of a full one — it would pass on a repository whose
      # second commit added a key and whose third removed it from the working tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts and public repositories, which is what
          # github.com/konradcinkusz/ab-ovo is. The action requires a license key only
          # when the repository belongs to a GitHub ORGANISATION; the day this repo moves
          # under one, that key goes in the repository secrets under this name and this
          # line starts resolving to it. Named here, unset today, so the failure on that
          # day reads as "buy a license" rather than as a scanner that stopped working.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
